<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take Exam | Rohi Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="css/students.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="padding-top:0;">

  <nav class="navbar navbar-expand-lg student-topbar">
    <div class="container-fluid px-3 px-lg-4">
      <div class="d-flex align-items-center gap-2">
        <a href="student.html" class="back-link" style="color:var(--purple-deep);text-decoration:none;font-weight:600;">
          <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
      </div>
      <div class="d-flex align-items-center gap-3 ms-auto">
        <span id="examTimer" class="topbar-badge" style="display:none;"></span>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-3 px-lg-4 py-4" style="max-width:820px;">

    <div id="loadingState" class="portal-card section-card text-center py-5">
      <div class="list-empty"><i class="bi bi-hourglass-split"></i>Loading exam...</div>
    </div>

    <div id="unavailableState" class="portal-card section-card text-center py-5" style="display:none;">
      <i class="bi bi-clipboard-x" style="font-size:2.5rem;color:#cbd5e1;"></i>
      <p class="mt-3 mb-3 text-muted" id="unavailableText">This exam isn't available to you.</p>
      <a href="student.html" class="action-link">Back to Dashboard</a>
    </div>

    <div id="examWrap" style="display:none;">
      <div class="portal-card section-card mb-4">
        <div class="section-header">
          <h5 class="mb-1" id="examTitle">—</h5>
          <p class="mb-0" id="examMeta">—</p>
        </div>
      </div>

      <form id="examForm">
        <div id="questionsWrap"></div>

        <div class="portal-card section-card d-flex justify-content-between align-items-center">
          <p class="mb-0 text-muted" id="answeredCount">0 of 0 answered</p>
          <button type="submit" class="btn sidebar-logout-btn" style="background:linear-gradient(135deg, var(--purple-deep), var(--purple-dark));color:#fff;border:none;padding:10px 24px;border-radius:10px;font-weight:600;" id="submitExamBtn">
            Submit Exam
          </button>
        </div>
      </form>
    </div>

    <div id="scoreState" class="portal-card section-card text-center py-5" style="display:none;">
      <i class="bi bi-check-circle-fill" style="font-size:2.5rem;color:var(--success-fg);"></i>
      <h4 class="mt-3 mb-1" id="scoreText">—</h4>
      <p class="text-muted mb-3">Your teacher can review this in their gradebook.</p>
      <a href="student.html" class="action-link">Back to Dashboard</a>
    </div>

  </main>

  <div class="toast-stack" id="toastStack"></div>

  <!-- Custom confirm modal (replaces browser confirm()) -->
  <div class="app-modal-backdrop" id="appModalBackdrop">
    <div class="app-modal">
      <p class="app-modal-message" id="appModalMessage"></p>
      <div class="app-modal-actions">
        <button type="button" class="app-modal-cancel" id="appModalCancel">Cancel</button>
        <button type="button" class="app-modal-confirm" id="appModalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://qxlskkxtvucebacqdivi.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4bHNra3h0dnVjZWJhY3FkaXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMzcwNDQsImV4cCI6MjA5OTgxMzA0NH0.9yO82WLR9SzMmTv8GPlb2C4oDALqpdAm6tGvys-2gX0";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function appConfirm(message) {
      return new Promise((resolve) => {
        const backdrop = document.getElementById("appModalBackdrop");
        const msgEl = document.getElementById("appModalMessage");
        const confirmBtn = document.getElementById("appModalConfirm");
        const cancelBtn = document.getElementById("appModalCancel");

        msgEl.textContent = message;
        backdrop.classList.add("show");

        function cleanup(result) {
          backdrop.classList.remove("show");
          confirmBtn.removeEventListener("click", onConfirm);
          cancelBtn.removeEventListener("click", onCancel);
          resolve(result);
        }
        function onConfirm() { cleanup(true); }
        function onCancel() { cleanup(false); }

        confirmBtn.addEventListener("click", onConfirm);
        cancelBtn.addEventListener("click", onCancel);
      });
    }

    function showToast(message) {
      const stack = document.getElementById("toastStack");
      const toast = document.createElement("div");
      toast.className = "mini-toast";
      toast.innerHTML = `<i class="bi bi-info-circle-fill"></i><span>${message}</span>`;
      stack.appendChild(toast);
      setTimeout(() => toast.classList.add("show"), 10);
      setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function showState(id) {
      ["loadingState", "unavailableState", "examWrap", "scoreState"].forEach((s) => {
        document.getElementById(s).style.display = s === id ? (s === "examWrap" ? "block" : "block") : "none";
      });
    }

    let timerInterval = null;
    let autoSubmitted = false;

    function startTimer(minutes, onExpire) {
      let secondsLeft = minutes * 60;
      const timerEl = document.getElementById("examTimer");
      timerEl.style.display = "inline-block";

      function tick() {
        const mins = Math.floor(secondsLeft / 60);
        const secs = secondsLeft % 60;
        timerEl.textContent = `${mins}:${secs.toString().padStart(2, "0")} left`;
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          onExpire();
          return;
        }
        secondsLeft--;
      }
      tick();
      timerInterval = setInterval(tick, 1000);
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const examId = params.get("exam");

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = "portal.html";
        return;
      }
      const { data: profile } = await supabaseClient.from("profiles").select("*").eq("id", session.user.id).single();
      if (!profile || profile.role !== "student") {
        window.location.href = "portal.html";
        return;
      }

      if (!examId) {
        showState("unavailableState");
        document.getElementById("unavailableText").textContent = "No exam was specified.";
        return;
      }

      const { data: rows, error } = await supabaseClient.rpc("get_exam_for_taking", { p_exam_id: examId });

      if (error || !rows || !rows.length) {
        showState("unavailableState");
        document.getElementById("unavailableText").textContent =
          "This exam isn't available — it may not be published for your class, or you've already submitted it.";
        return;
      }

      const { title, duration_minutes } = rows[0];
      document.getElementById("examTitle").textContent = title;
      document.getElementById("examMeta").textContent = `${rows.length} question${rows.length === 1 ? "" : "s"} · ${duration_minutes} minute${duration_minutes === 1 ? "" : "s"}`;

      const questionsWrap = document.getElementById("questionsWrap");
      questionsWrap.innerHTML = rows.map((q, i) => `
        <div class="portal-card section-card mb-3">
          <p class="fw-semibold mb-3">${i + 1}. ${q.question_text}</p>
          <div class="d-flex flex-column gap-2">
            ${["a", "b", "c", "d"].map((opt) => `
              <label class="d-flex align-items-center gap-2" style="cursor:pointer;">
                <input type="radio" name="q_${q.question_id}" value="${opt}" class="question-radio" data-question="${q.question_id}" />
                <span>${opt.toUpperCase()}) ${q["option_" + opt]}</span>
              </label>`).join("")}
          </div>
        </div>`).join("");

      const totalQuestions = rows.length;
      function updateAnsweredCount() {
        const answered = new Set([...questionsWrap.querySelectorAll(".question-radio:checked")].map((r) => r.dataset.question)).size;
        document.getElementById("answeredCount").textContent = `${answered} of ${totalQuestions} answered`;
      }
      questionsWrap.addEventListener("change", updateAnsweredCount);
      updateAnsweredCount();

      showState("examWrap");
      startTimer(duration_minutes, () => {
        showToast("Time's up — submitting your answers.");
        submitExam(examId, totalQuestions, true);
      });

      document.getElementById("examForm").addEventListener("submit", (e) => {
        e.preventDefault();
        submitExam(examId, totalQuestions, false);
      });
    }

    async function submitExam(examId, totalQuestions, isAutoSubmit) {
      if (autoSubmitted) return;
      autoSubmitted = true;
      clearInterval(timerInterval);

      const answers = {};
      document.querySelectorAll(".question-radio:checked").forEach((r) => {
        answers[r.dataset.question] = r.value;
      });

      if (!isAutoSubmit) {
        const answeredCount = Object.keys(answers).length;
        if (answeredCount < totalQuestions) {
          const proceed = await appConfirm(`You've answered ${answeredCount} of ${totalQuestions} questions. Submit anyway?`);
          if (!proceed) {
            autoSubmitted = false;
            return;
          }
        }
      }

      const btn = document.getElementById("submitExamBtn");
      if (btn) { btn.disabled = true; btn.textContent = "Submitting..."; }

      const { data, error } = await supabaseClient.rpc("submit_exam_attempt", { p_exam_id: examId, p_answers: answers });

      if (error) {
        showToast(error.message);
        autoSubmitted = false;
        if (btn) { btn.disabled = false; btn.textContent = "Submit Exam"; }
        return;
      }

      const result = data && data[0];
      showState("scoreState");
      document.getElementById("scoreText").textContent = result
        ? `You scored ${result.score} out of ${result.total_questions}`
        : "Exam submitted.";
    }

    init();
  </script>
</body>
</html>
